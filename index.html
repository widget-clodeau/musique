<title>Maquette</title>
<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --sheet: #f2f2f7; --card2: #ffffff;
  --fg: #000000; --sec: #6c6c70; --ter: #8e8e93;
  --sep: rgba(60, 60, 67, .16); --fill: rgba(120, 120, 128, .16);
  --bar: rgba(249, 249, 249, .82); --acc: #e5254a; --accsoft: rgba(229, 37, 74, .12);
  --shadow: 0 10px 30px rgba(0, 0, 0, .14);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --sheet: #1c1c1e; --card2: #2c2c2e;
    --fg: #ffffff; --sec: #98989f; --ter: #6e6e73;
    --sep: rgba(84, 84, 88, .55); --fill: rgba(120, 120, 128, .32);
    --bar: rgba(28, 28, 30, .82); --acc: #ff4d6d; --accsoft: rgba(255, 77, 109, .16);
    --shadow: 0 10px 30px rgba(0, 0, 0, .6);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.3 var(--font); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
svg { display: block; }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }

/* ---------- barre du haut ---------- */
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); background: transparent; transition: background .2s; }
.navbar.scrolled { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); box-shadow: 0 0.5px 0 var(--sep); }
.nb { max-width: 680px; margin: 0 auto; height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; }
.nb-t { font-weight: 600; opacity: 0; transition: opacity .15s; white-space: nowrap; max-width: 52vw; overflow: hidden; text-overflow: ellipsis; }
.navbar.scrolled .nb-t { opacity: 1; }
.nb-l { justify-self: start; display: flex; gap: 2px; } .nb-r { justify-self: end; display: flex; gap: 2px; }
.tb { color: var(--acc); font-size: 17px; min-height: 44px; min-width: 44px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; }
.tb b { font-weight: 600; }
.tb .ic { font-size: 22px; }

.content { max-width: 680px; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top, 0px)) 0 calc(150px + env(safe-area-inset-bottom, 0px)); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.push { animation: pushIn .3s cubic-bezier(.2, .8, .2, 1); } .pop { animation: popIn .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes pushIn { from { transform: translateX(28%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popIn { from { transform: translateX(-12%); opacity: 0; } to { transform: none; opacity: 1; } }
.large { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .2px; margin: 4px 16px 12px; }
.sub { color: var(--sec); font-size: 15px; }

/* ---------- pochettes ---------- */
.cov { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; container-type: inline-size; background: var(--ter); }
.cov i { position: absolute; width: 82%; height: 82%; border-radius: 50%; right: -22%; bottom: -26%; opacity: .5; }
.cov i::after { content: ""; position: absolute; inset: 38%; border-radius: 50%; background: var(--c0); }
.cov b { position: absolute; left: 10%; top: 6%; font-size: 40cqw; line-height: 1; font-weight: 800; letter-spacing: -.03em; }
.cov em { position: absolute; left: 10%; bottom: 9%; font-style: normal; font-size: 8.5cqw; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.cov img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shadow { box-shadow: 0 8px 22px rgba(0, 0, 0, .18); }

/* ---------- albums ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 16px; padding: 0 16px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.al { text-align: left; display: grid; gap: 8px; min-width: 0; }
.al:active .cov { transform: scale(.97); } .cov { transition: transform .15s; }
.al strong { font-weight: 500; font-size: 15px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.al small { color: var(--sec); font-size: 13px; display: block; margin-top: 1px; }
.empty { text-align: center; padding: 60px 32px; color: var(--sec); display: grid; gap: 10px; justify-items: center; }
.empty .disc { width: 110px; height: 110px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; margin-bottom: 8px; }
.empty .disc::after { content: ""; width: 34px; height: 34px; border-radius: 50%; background: var(--bg); }
.empty h2 { margin: 0; color: var(--fg); font-size: 22px; }
.empty p { margin: 0; max-width: 28ch; }

/* ---------- boutons ---------- */
.btn { min-height: 50px; padding: 0 20px; border-radius: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--acc); color: #fff; }
.btn.tint { background: var(--accsoft); color: var(--acc); }
.btn.plain { background: var(--fill); color: var(--fg); }
.btn.danger { background: var(--card2); color: #ff453a; width: 100%; }
.btn:active, .tb:active { opacity: .6; }
.btn .ic { font-size: 20px; }
.btn.armed { background: #ff453a; color: #fff; }

/* ---------- album ---------- */
.head { display: grid; justify-items: center; gap: 4px; padding: 4px 16px 16px; text-align: center; }
.head .cov { width: min(62vw, 250px); border-radius: 12px; margin-bottom: 14px; }
.head h1 { margin: 0; font-size: 22px; line-height: 1.2; }
.head .sub { margin-bottom: 8px; }
.pbar { display: flex; gap: 2px; height: 6px; width: 100%; max-width: 340px; border-radius: 3px; overflow: hidden; background: var(--fill); }
.pbar span { min-width: 2px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 20px; }

/* ---------- listes ---------- */
.grp { background: var(--card); border-radius: 12px; margin: 0 16px; overflow: hidden; }
.sheet .grp { background: var(--card2); }
.row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px 8px 16px; position: relative; width: 100%; text-align: left; background: transparent; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
.row.lift { background: var(--card2); box-shadow: var(--shadow); z-index: 5; border-radius: 10px; }
.row.lift::before, .row.lift + .row::before { display: none; }
.row .n { width: 20px; text-align: center; color: var(--sec); font-size: 15px; font-variant-numeric: tabular-nums; flex: none; }
.row .m { flex: 1; min-width: 0; }
.row .m strong { font-weight: 400; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      title: "Réglages", html: '<div class="lbl"><span>Stockage</span></div><div class="grp"><div class="kv"><span>Utilisé</span><span id="su" style="color:var(--sec)">…</span></div><div class="kv"><span>Protégé</span><span id="sp" style="color:var(--sec)">…</span></div></div><div style="padding:12px 16px 0"><button class="btn plain" id="sprot" style="width:100%">Protéger mes données</button></div><p class="mute">Tes morceaux, paroles et notes vocales sont gardés sur cet appareil, dans ce navigateur. Ajoute Maquette à l\'écran d\'accueil de ton iPhone pour qu\'iOS ne les efface pas.</p>' + (memOnly ? '<p class="mute" style="color:#ff453a">Le stockage est indisponible : tes données seront perdues à la fermeture.</p>' : ""),
      build: function (api) {
        function paint() {
          if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(function (e) { $("#su", api.el).textContent = ((e.usage || 0) / 1048576).toFixed(1) + " Mo"; }); else $("#su", api.el).textContent = "—";
          if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(function (p) { $("#sp", api.el).textContent = p ? "Oui" : "Non"; $("#sprot", api.el).hidden = p; });
        }
        paint();
        $("#sprot", api.el).addEventListener("click", function () { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function (ok) { toast(ok ? "Données protégées" : "Refusé par le navigateur : ajoute l'app à l'écran d'accueil"); paint(); }); });
      }
    });
  }

  // ======================= glisser pour réordonner =======================
  var drag = null;
  document.addEventListener("pointerdown", function (e) {
    var g = e.target.closest("[data-grip]"); if (!g) return;
    var row = g.closest(".row"), box = $("#tl"); if (!row || !box) return;
    e.preventDefault(); g.setPointerCapture(e.pointerId);
    var r = row.getBoundingClientRect();
    drag = { row: row, box: box, off: e.clientY - r.top, grip: g, id: e.pointerId }; row.classList.add("lift");
  });
  document.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var row = drag.row, box = drag.box, y = e.clientY;
    var sibs = $$(".row", box).filter(function (r) { return r !== row; }), before = null;
    for (var i = 0; i < sibs.length; i++) { var rr = sibs[i].getBoundingClientRect(); if (y < rr.top + rr.height / 2) { before = sibs[i]; break; } }
    if (before) { if (row.nextSibling !== before) box.insertBefore(row, before); } else if (box.lastElementChild !== row) box.appendChild(row);
    row.style.transform = "none"; var nat = row.getBoundingClientRect().top; row.style.transform = "translateY(" + (y - drag.off - nat) + "px)";
    if (y < 90) window.scrollBy(0, -8); else if (y > window.innerHeight - 130) window.scrollBy(0, 8);
  });
  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    var a = album(UI.albumId), ids = $$(".row", drag.box).map(function (r) { return r.dataset.row; });
    drag.row.classList.remove("lift"); drag.row.style.transform = "";
    if (a) { a.tracks = ids.concat(a.tracks.filter(function (x) { return ids.indexOf(x) < 0; })); save(); }
    $$(".row", drag.box).forEach(function (r, i) { var n = $(".n", r); if (n) n.textContent = i + 1; });
    drag = null; render();
  }
  document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);

  // ======================= actions =======================
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var act = el.dataset.act, id = el.dataset.id;
    if (act === "playTrack") { e.stopPropagation(); var a0 = UI.tab === "albums" && album(UI.albumId); var ids = a0 ? a0.tracks : trackList().map(function (t) { return t.id; }); if (P.id === id) togglePlay(); else playQueue(ids, ids.indexOf(id)); return; }
    switch (act) {
      case "tab": UI.tab = id; UI.albumId = null; UI.edit = false; window.scrollTo(0, 0); render(); break;
      case "openAlbum": UI.albumId = id; UI.edit = false; window.scrollTo(0, 0); render("push"); break;
      case "back": UI.albumId = null; UI.edit = false; render("pop"); break;
      case "newAlbum": albumSheet(null); break;
      case "editAlbum": albumSheet(album(UI.albumId)); break;
      case "toggleEdit": UI.edit = !UI.edit; render(); break;
      case "rmTrack": var a1 = album(UI.albumId); a1.tracks = a1.tracks.filter(function (x) { return x !== id; }); save(); render(); break;
      case "addTracks": addTracksSheet(album(UI.albumId)); break;
      case "newTrack": newTrackSheet(UI.tab === "albums" ? UI.albumId : null); break;
      case "openTrack": trackSheet(id); break;
      case "playAlbum": var a2 = album(UI.albumId); if (!a2.tracks.length) break; var pq = a2.tracks.filter(function (x) { return playable(S.tracks[x]); }); if (!pq.length) { toast("Aucun morceau n'a d'audio"); break; } if (P.id && pq.indexOf(P.id) >= 0 && P.queue.join() === pq.join()) togglePlay(); else playQueue(pq, 0); break;
      case "filter": UI.filter = id; render(); break;
      case "freeTracks": UI.tab = "tracks"; UI.filter = "free"; render(); break;
      case "settings": settingsSheet(); break;
      case "plOpen": if (!e.target.closest("button")) openPlayer(); break;
      case "plPlay": e.stopPropagation(); togglePlay(); break;
      case "plNext": e.stopPropagation(); nextTrack(false); break;
      case "plPrev": prevTrack(); break;
      case "plClose": closePlayer(); break;
    }
  });
  document.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".row[data-act],.mini[data-act]")) { e.preventDefault(); e.target.click(); } });
  document.addEventListener("input", function (e) { if (e.target.id === "q") { UI.q = e.target.value; var pos = e.target.selectionStart; render(); var q = $("#q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } } });

  // ======================= démarrage =======================
  openDB().then(function (ok) {
    if (!ok) { memOnly = true; return null; }
    return idb("meta", "readonly", function (s) { return s.get("state"); }).catch(function () { return null; });
  }).then(function (raw) {
    if (raw) { try { var o = JSON.parse(raw); S = { albums: o.albums || [], tracks: o.tracks || {} }; } catch (e) {} }
    mountPlayer();
    var pre = []; S.albums.forEach(function (a) { if (a.cover) pre.push(ensureURL(a.cover)); });
    return Promise.all(pre);
  }).then(function () {
    render();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    if (memOnly) toast("Stockage indisponible dans ce navigateur");
  });
})();
</script>
